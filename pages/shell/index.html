<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M1 Quant Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    body { display: flex; flex-direction: column; background: #F4F4F5; }

    .tab-bar {
      height: 48px;
      background: #FFFFFF;
      border-bottom: 1px solid #E4E4E7;
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 4px;
      flex-shrink: 0;
      z-index: 100;
    }
    .tab-logo {
      font-weight: 700;
      font-size: 14px;
      color: #18181B;
      margin-right: 16px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .tab-logo span { color: #71717A; font-weight: 400; }
    .tab-btn {
      padding: 6px 16px;
      font-size: 13px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: #52525B;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab-btn:hover { background: #F4F4F5; color: #18181B; }
    .tab-btn.active { background: rgba(37, 99, 235, 0.12); color: #2563EB; font-weight: 600; }
    .tab-status {
      margin-left: auto;
      font-size: 11px;
      color: #A1A1AA;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-status .dot { width: 6px; height: 6px; border-radius: 50%; }
    .tab-status .dot.online { background: #10B981; }
    .tab-status .dot.offline { background: #EF4444; }

    .content-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .content-area iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }
    .content-area iframe.active { display: block; }
  </style>
</head>
<body>
  <div class="tab-bar">
    <div class="tab-logo">M1 <span>QUANT</span></div>
    <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">盘中概览</button>
    <button class="tab-btn" data-tab="etf" onclick="switchTab('etf')">ETF行情</button>
    <button class="tab-btn" data-tab="trade" onclick="switchTab('trade')">交易助手</button>
    <button class="tab-btn" data-tab="astro" onclick="switchTab('astro')">天时实验</button>
    <div class="tab-status">
      <span class="dot online" id="status-dot"></span>
      <span id="status-text">已连接</span>
    </div>
  </div>
  <div class="content-area">
    <iframe id="frame-overview" class="active" src="http://127.0.0.1:8781" allow="clipboard-write"></iframe>
    <iframe id="frame-etf" src="" data-src="http://127.0.0.1:8782" allow="clipboard-write"></iframe>
    <iframe id="frame-trade" src="" data-src="http://127.0.0.1:8783" allow="clipboard-write"></iframe>
    <iframe id="frame-astro" src="" data-src="http://127.0.0.1:8784" allow="clipboard-write"></iframe>
  </div>

  <script>
    const PAGES = {
      overview: { port: 8781 },
      etf:      { port: 8782 },
      trade:    { port: 8783 },
      astro:    { port: 8784 }
    };

    let currentTab = 'overview';

    function switchTab(name) {
      if (name === currentTab) return;
      currentTab = name;

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`[data-tab="${name}"]`).classList.add('active');

      document.querySelectorAll('.content-area iframe').forEach(f => f.classList.remove('active'));
      const frame = document.getElementById(`frame-${name}`);
      frame.classList.add('active');

      if (!frame.src || frame.src === window.location.href) {
        const ds = frame.getAttribute('data-src');
        if (ds) frame.src = ds;
      }
    }
  </script>
</body>
</html>
