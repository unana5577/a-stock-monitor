### 2.4 风险等级评估

**目的**：衡量板块当前的热度和估值压力，用于控制仓位。

**输入**：
- Alpha_20 分位数（过去20日超额收益相对于自身历史的分位，滚动60日窗口）
- Amount_Share 分位数（资金热度占比相对于自身历史的分位，滚动60日窗口）

**输出**：风险等级（低风险、中风险、中高风险、高风险）

**判断逻辑**：

```python
def get_risk_level(alpha20_quantile, amount_share_quantile):
    if alpha20_quantile > 0.8 and amount_share_quantile > 0.8:
        return "高风险"
    elif alpha20_quantile > 0.8:
        return "中高风险"
    elif alpha20_quantile > 0.5:
        return "中风险"
    else:
        return "低风险"
```

**说明**：分位数计算基于过去60日滚动窗口，每日更新。

---

### 2.5 操作建议生成

**目的**：融合趋势、资金行为、风险等级，生成最终操作建议。

**输入**：
- 趋势标签
- 资金行为标签
- 风险等级

**输出**：操作建议（如积极建仓、轻仓试探、分批止盈、逐步减仓、持有观察、果断离场、关注企稳、观望、小仓埋伏等）

**映射规则**（优先级自上而下，命中即返回）：

| 趋势 | 资金行为 | 风险等级 | 操作建议 |
|------|----------|----------|----------|
| 上升趋势 | 放量启动 | 低/中 | 积极建仓 |
| 上升趋势 | 放量启动 | 高 | 轻仓试探 |
| 上升趋势 | 加速赶顶 | 任意 | 分批止盈 |
| 上升趋势 | 放量滞涨 | 任意 | 逐步减仓 |
| 上升趋势 | 资金撤退 | 任意 | 逐步减仓 |
| 上升趋势 | 十字星预警 | 低/中 | 谨慎观望 |
| 上升趋势 | 十字星预警 | 高 | 减仓 |
| 上升趋势 | 其他 | 低/中 | 持有观察 |
| 上升趋势 | 其他 | 高 | 谨慎持有 |
| 下降趋势 | 恐慌出逃 | 任意 | 果断离场 |
| 下降趋势 | 缩量企稳 | 低/中 | 轻仓试探 |
| 下降趋势 | 缩量企稳 | 高 | 观望 |
| 下降趋势 | 十字星预警 | 低/中 | 关注企稳 |
| 下降趋势 | 十字星预警 | 高 | 观望 |
| 下降趋势 | 其他 | 任意 | 观望/空仓 |
| 横盘整理 | 放量启动 | 任意 | 轻仓试探 |
| 横盘整理 | 恐慌出逃 | 任意 | 观望 |
| 横盘整理 | 其他 | 任意 | 观望/小仓埋伏 |

**注**：实际实现时需考虑市场情绪过滤的影响，在生成建议前或后根据情绪等级调整。

---

## 三、指标定义与计算

| 指标 | 定义 | 计算方法 |
|------|------|----------|
| MA20 | 20日收盘价均值 | 滚动20日平均 |
| MA20斜率 | MA20的变化率 | (MA20_t - MA20_{t-5}) / 5 |
| 量比 | 当日成交额 / 3日均量 | volume / volume_ma3 |
| 资金热度占比 | ETF成交额 / 全市场成交额 | amount_share |
| 资金热度变化 | 当前资金热度 / 3日均值 - 1 | amount_share / amount_share_ma3 - 1 |
| Alpha_5 | 5日超额收益 | ETF 5日涨幅 - 基准指数5日涨幅（基准动态选择） |
| Alpha_20 | 20日超额收益 | ETF 20日涨幅 - 基准指数20日涨幅 |
| 分位数 | 某指标当前值在过去60日中的排名 | (rank - 1) / (60 - 1) |
| K线形态 | 见2.3.1 | 根据OHLC计算 |

---

## 四、数据需求

### 4.1 必须数据（日线级别）
- ETF：代码、日期、开盘价、最高价、最低价、收盘价、成交额
- 基准指数（上证、深证、创业板、科创50）：日期、收盘价
- 全市场成交额：两市合计成交额

### 4.2 派生数据
- 全市场涨跌家数（用于情绪过滤，可选，初期可先用成交额替代）

### 4.3 数据更新
- 每日收盘后批量更新，用于次日信号生成

---

## 五、回测与验证

### 5.1 回测目标
- 验证核心逻辑的有效性
- 优化各阈值（如量比阈值、分位数阈值等）
- 评估不同市场状态下的表现

### 5.2 回测配置
- 标的：7个行业ETF
- 时间范围：2025-05-19 至今
- 评估指标：准确率（按操作建议分类）、胜率、夏普比率、最大回撤

### 5.3 手动标记反馈
- 开发前端页面，支持对历史日期的判断结果进行正确/错误标记
- 标记数据用于后续逻辑优化

---

## 六、输出格式

### 6.1 每日信号输出（JSON示例）
```json
{
  "date": "2026-03-10",
  "symbol": "512480",
  "name": "半导体ETF",
  "trend": "上升趋势",
  "fund_behavior": "放量启动",
  "risk_level": "中风险",
  "market_sentiment": "正常",
  "advice": "积极建仓",
  "reason": "上升趋势中放量启动，风险中等，市场情绪正常。"
}
```

### 6.2 回测报告输出
- 总体准确率
- 各操作建议准确率
- 各ETF准确率
- 收益曲线、夏普、最大回撤

---

## 七、开发阶段建议

1. **阶段A**：实现基础指标计算、趋势判断、风险等级评估。
2. **阶段B**：实现资金行为判断（含K线形态识别），生成资金行为标签。
3. **阶段C**：实现操作建议映射，完成每日信号输出。
4. **阶段D**：集成市场情绪过滤，完善回测框架。
5. **阶段E**：开发手动标记前端，收集反馈。

